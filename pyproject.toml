[project]
name = "arcp"
version = "0.1.0"
description = "Reference Python implementation of the Agent Runtime Control Protocol (ARCP) v1.0"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "ARCP Reference" }]
dependencies = [
    "pydantic>=2.7,<3",
    "aiosqlite>=0.20",
    "websockets>=13",
    "structlog>=24",
    "pyjwt[crypto]>=2.9",
    "click>=8.1",
    "jsonschema>=4.23",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pyright>=1.1",
    "pre-commit>=3",
]

[project.scripts]
arcp = "arcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arcp"]

[tool.pyright]
include = ["src/arcp", "tests"]
strict = ["src/arcp"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
# Phase 3 narrows these on public modules; Phase 5 drops them entirely.
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
# Phase 9 adds "D" (pydocstyle).
select = [
    "E", "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "RUF",
    "PTH",
    "PT",
    "RET",
    "TRY",
    "ASYNC",
    "ERA",
    "ARG",
    "SLF",
    "TID",
    "PERF",
]
ignore = [
    "E501",  # line-too-long: handled by ruff format; surfaced cases are pydantic Field descriptions.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["arcp"]
branch = true
omit = [
    # The CLI is a thin click wrapper and is exercised end-to-end out of band.
    "src/arcp/cli.py",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
