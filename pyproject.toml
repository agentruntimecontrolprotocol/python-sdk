[project]
name = "agentruntimecontrolprotocol"
version = "1.1.3"
description = "Reference Python implementation of the Agent Runtime Control Protocol (ARCP) v1.1"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "ARCP Reference" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# Default install: kitchen-sink. `pip install agentruntimecontrolprotocol`
# pulls every dep the SDK can use — client transports, runtime
# (sqlite + JWT), OpenTelemetry middleware, and JWKS over HTTPS — so
# everything just works without thinking about extras.
dependencies = [
    "pydantic>=2.13.4,<3",
    "structlog>=25.5.0",
    "python-ulid>=3.1.0",
    "websockets>=16.0",
    "click>=8.4.1",
    "aiosqlite>=0.22.1",
    "pyjwt[crypto]>=2.13.0",
    "opentelemetry-api>=1.42.1,<2",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
# Semantic intent markers. Python extras can only add deps, not
# subtract — and the default install already pulls everything — so
# these are no-ops at install time. They exist so `pip install
# "agentruntimecontrolprotocol[client]"` documents the consumer's
# intent in lockfiles and dependency manifests.
client = []
runtime = []
otel = []
jwks = []
# `pip install agentruntimecontrolprotocol[test]` — enough to run
# `pytest --cov --cov-branch --cov-report=xml` against the full suite.
test = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.3.0",
    "pytest-randomly>=4.1.0",
    "pytest-timeout>=2.4.0",
    "hypothesis>=6.152.9",
    "dirty-equals>=0.11",
    "aiohttp>=3.13.5",
    "starlette>=1.0.1",
    "opentelemetry-sdk>=1.42.1,<2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=4.1.0",
    "pytest-timeout>=2.4.0",
    "hypothesis>=6.152.9",
    "dirty-equals>=0.11",
    "ruff>=0.15.14",
    "pyright>=1.1.409",
    "opentelemetry-sdk>=1.42.1,<2",
    "aiohttp>=3.13.5",
    "starlette>=1.0.1",
    "httpx>=0.28.1",
    "mypy>=2.1.0",
]

[project.scripts]
arcp = "arcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arcp"]

[tool.pyright]
include = ["src/arcp", "tests"]
strict = ["src/arcp"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "C4", "C90", "SIM", "RUF",
    "PTH", "PT", "RET", "TRY", "ASYNC", "ARG", "PERF", "PLR",
]
ignore = [
    "E501", "TRY003", "TRY004", "TRY203", "N818",
    "RUF002", "RUF006", "PERF401",
    # PLR rules we don't enforce (kept narrow):
    "PLR2004",  # magic-value-comparison: too noisy for protocol code
    "PLR0904",  # too-many-public-methods (15 covered by guide §0 manually)
]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "B011", "B017", "ARG001", "ARG002", "ARG005", "ASYNC109", "ASYNC110",
    "E402", "PT011", "PT017", "SIM102", "SIM117", "N806", "TRY300",
    "C901", "PLR0913", "PLR0912", "PLR0915",
]
"examples/**" = [
    "ARG001", "ARG002", "ARG005", "B017", "N806", "PT017", "SIM102",
    "SIM117", "ASYNC110", "TRY300", "C901", "PLR0913", "PLR0912", "PLR0915",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src/arcp"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*", "examples.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config --cov=arcp --cov-fail-under=89 --cov-branch --timeout=10"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["arcp"]
branch = true
# Keep this list short — widening it hides real gaps. Each omission is
# either a thin CLI/entrypoint wrapper exercised via `python -m arcp`,
# a transport/middleware adapter exercised by integration tests instead
# of unit tests, or a persistence layer (`SqliteEventLog`) that requires
# an `aiosqlite` fixture to drive end-to-end and is itself covered by
# the CLI replay path.
omit = [
    "src/arcp/cli.py",
    "src/arcp/__main__.py",
    "src/arcp/middleware/asgi.py",
    "src/arcp/middleware/aiohttp.py",
    "src/arcp/middleware/otel.py",
    "src/arcp/_transport/stdio.py",
    "src/arcp/_transport/websocket.py",
    "src/arcp/_store/eventlog.py",
    "src/arcp/_auth/jwt.py",
]

[tool.coverage.report]
show_missing = true
# Coverage floor (combined line + branch). `branch=true` ensures branch
# coverage is part of this number, so this single threshold guards
# against both line and branch regressions and makes branch shortfalls
# visible in the same failure path that catches line shortfalls. CI
# also passes `--cov-branch` explicitly via pytest addopts to make this
# invariant locally reproducible.
fail_under = 89
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
