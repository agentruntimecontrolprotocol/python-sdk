language: en-US
early_access: false
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - '!**/__pycache__/**'
    - '!**/*.pyc'
    - '!**/.venv/**'
    - '!**/venv/**'
    - '!**/dist/**'
    - '!**/build/**'
    - '!**/*.egg-info/**'
    - '!uv.lock'
chat:
  auto_reply: true
