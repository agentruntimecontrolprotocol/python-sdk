# Opt-in services for examples/ real-mode tests.
#
# Usage:
#   docker compose -f examples/docker-compose.yml up openldap
#   docker compose -f examples/docker-compose.yml up langfuse otel-collector
#
# Nothing here is required for default-mode tests. Each example's README
# explains which service(s) it needs and how to point at them via the env
# vars documented in `.env.example`.

services:
  openldap:
    image: bitnami/openldap:2.6
    environment:
      LDAP_ROOT: "dc=example,dc=com"
      LDAP_ADMIN_USERNAME: "admin"
      LDAP_ADMIN_PASSWORD: "adminpassword"
      LDAP_USERS: "alice,bob,carol"
      LDAP_PASSWORDS: "alicepw,bobpw,carolpw"
    ports:
      - "1389:1389"
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://localhost:1389", "-b", "dc=example,dc=com"]
      interval: 10s
      retries: 5

  langfuse:
    image: langfuse/langfuse:2
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@langfuse-db:5432/langfuse"
      NEXTAUTH_SECRET: "examples-only-not-a-secret"
      NEXTAUTH_URL: "http://localhost:3000"
      SALT: "examples-only-not-a-secret"
    ports:
      - "3000:3000"
    depends_on:
      langfuse-db:
        condition: service_healthy

  langfuse-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: langfuse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./07_triple_sink_observability/fixtures/otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
