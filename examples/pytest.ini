[pytest]
# Local pytest config for `examples/`. Decouples examples test runs from the
# SDK's own pyproject.toml [tool.pytest.ini_options], which targets the SDK's
# `arcp` package coverage.
#
# Per-phase coverage floor (see EXAMPLES_PLAN.md) is enforced via the gate
# command set, not addopts, so this file stays minimal.
testpaths = .
asyncio_mode = auto
addopts = -ra --strict-markers --strict-config
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning
