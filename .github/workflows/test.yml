# CI for the ARCP Python SDK.
#
# Action pinning policy:
#   - First-party `actions/*` actions are pinned to a major tag (e.g. `@v4`).
#     GitHub controls these repos and major tags only move forward to
#     non-breaking releases.
#   - Third-party actions are pinned to a full commit SHA with the human-
#     readable version in a trailing comment.
name: test

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".editorconfig"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".editorconfig"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: [self-hosted, linux, arm64, arcp]
    strategy:
      fail-fast: false
      matrix:
        # `requires-python = ">=3.13"` in pyproject.toml.
        # Floor + latest stable. 3.13 is currently both, 3.14 is the next stable.
        python-version: ["3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v6.10.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # actions/setup-python has no linux-arm64 builds for self-hosted
      # runners; uv installs python-build-standalone, which ships arm64.
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install project
        run: uv sync --frozen --all-extras --dev --python ${{ matrix.python-version }}

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

      - name: Pytest
        run: uv run pytest --junitxml=junit-${{ matrix.python-version }}.xml --cov-report=xml

      # Upload coverage from the floor matrix entry only — the report is the
      # same on every Python version, so one upload is enough. Non-blocking:
      # a Codecov outage must not break CI.
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13'
        # codecov/codecov-action v6.0.1
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          fail_ci_if_error: false
          flags: unittests
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload junit XML on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ matrix.python-version }}
          path: junit-${{ matrix.python-version }}.xml
          if-no-files-found: ignore
